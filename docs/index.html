<!DOCTYPE html>
<!--
  The GitHub Pages root for this repository, so that
  https://dhiva-labs.github.io/SecureShellGo/ is not a 404 next to the privacy
  policy that Google Play links to. Nothing more is intended here — the
  README on GitHub is the real landing page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureShell Go</title>
<meta name="description" content="SecureShell Go — an SSH terminal and SFTP client for Android, by Dhiva Labs.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1b1f23; --muted: #5a636c; --accent: #1a7f45;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1419; --fg: #e6e9ec; --muted: #98a2ac; --accent: #6cd48f; }
  }
  body {
    margin: 0;
    padding: 4rem 1.25rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 .5rem; }
  p.tagline { color: var(--muted); margin-top: 0; }
  ul { padding-left: 1.1rem; }
  li { margin: .5rem 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>SecureShell Go</h1>
  <p class="tagline">An SSH terminal and SFTP client for Android, by Dhiva
  Labs.</p>
  <ul>
    <li><a href="privacy-policy/">Privacy policy</a></li>
    <li><a href="https://github.com/Dhiva-Labs/SecureShellGo">Source code and
        releases on GitHub</a></li>
  </ul>
</main>
</body>
</html>
