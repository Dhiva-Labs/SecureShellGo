# Strings live in lib/l10n/app_<language>.arb; app_en.arb is the template
# every other language is checked against. `flutter gen-l10n` (run by
# `flutter pub get` and every build, since pubspec sets `generate: true`)
# writes AppLocalizations into lib/l10n/.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
