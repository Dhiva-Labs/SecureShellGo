# Package metadata for the other-distribution packages (.rpm, Arch package,
# AppImage, AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with debian/control:
# the installed tree is the PPA package's layout, made from the release
# tarball by packaging/linux-distros/tree.sh.

NAME=secureshellgo
APP_NAME=SecureShellGo
GITHUB_REPO=Dhiva-Labs/SecureShellGo
TAG_PREFIX=v
SUMMARY='SSH terminal and SFTP client with strict host-key verification'
DESCRIPTION='SecureShell Go is a fast, security-first SSH terminal and SFTP client. Run a real interactive xterm-256color shell and transfer files over SFTP, with trust-on-first-use host-key verification at the core: a changed host key blocks the connection outright. Passwords, private keys and passphrases are kept only in encrypted secure storage.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/SecureShellGo
LICENSE=MIT
LICENSE_FILE=LICENSE

# lib/libdartjni.so comes from the `jni` package the Android plugins pull in.
# CMake builds it only when it finds a JDK (the CI runners have one) and links
# it to that JDK's libjvm.so; the desktop app never loads it. Shipping it
# would make rpm require libjvm.so and fail the ldd check, so every new format
# leaves it out.
EXCLUDE=(opt/secureshellgo/lib/libdartjni.so)

# rpm: libraries (GTK 3, libsecret for flutter_secure_storage) come from the
# ELF files, except EGL and GLES: Flutter's engine opens them at run time
# (libepoxy), so they are no NEEDED entries, and a minimal Fedora does not
# have libGLESv2; as rpm soname capabilities they resolve on Fedora and
# openSUSE alike. flutter_secure_storage_linux needs libsecret only (no
# libjsoncpp), so nothing has to be bundled for a soname the other
# distributions name differently.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# The .deb's Recommends: a Secret Service provider for saved passwords and
# keys (gnome-keyring | kwalletd6 | kwalletd5 | keepassxc), as one rich weak
# dependency on the daemons' paths, which Fedora and openSUSE package under
# different names.
RPM_RECOMMENDS=('(/usr/bin/gnome-keyring-daemon or /usr/bin/kwalletd6 or /usr/bin/kwalletd5 or /usr/bin/keepassxc)')
ARCH_DEPENDS=(gtk3 libsecret gcc-libs libglvnd)
ARCH_OPTDEPENDS=(
  'gnome-keyring: stores saved passwords and keys (Secret Service)'
  'kwallet: stores saved passwords and keys on KDE (Secret Service)'
  'keepassxc: stores saved passwords and keys (Secret Service)'
)
ARCH_INDEPENDENT=0

# AppImage: started at the Flutter runner, which finds lib/ and data/ next to
# itself (the .deb's /usr/bin wrapper only execs it).
APPIMAGE=1
# libsecret (flutter_secure_storage) is not on every desktop and a minimal
# Fedora lacks it, so the AppImage carries its own copy; the .rpm and the
# Arch package depend on the distribution's.
APPIMAGE_BUNDLE=(libsecret-1.so.0)
EXEC=opt/secureshellgo/secure_shell_go
DESKTOP=usr/share/applications/com.dhivalabs.secure_shell_go.desktop
ICON=usr/share/icons/hicolor/256x256/apps/secureshellgo.png
APPRUN_ENV=''

# Smoke test in each distribution container (verify.sh mounts the repository
# at /src): packaging/linux-distros/smoke.sh, the check CI runs on the
# tarball, waits for the visible "SecureShell Go" window and for the data
# folder the Dart start-up code creates.
GUI_CMD=secureshellgo
SMOKE_SCRIPT=packaging/linux-distros/smoke.sh
SMOKE_SECONDS=20
SMOKE_CMD=''
